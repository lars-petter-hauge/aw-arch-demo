services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - RESULT_CACHE_URL=redis://redis:6379
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker_a:
    build: ./worker_a
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - RESULT_CACHE_URL=redis://redis:6379

  worker_b:
    build: ./worker_b
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - RESULT_CACHE_URL=redis://redis:6379
