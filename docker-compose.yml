services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379

  worker_a:
    build: ./worker_a
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379

  worker_b:
    build: ./worker_b
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
