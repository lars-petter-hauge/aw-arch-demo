services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: ./monitoring
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
    environment:
      - API_URL=http://api:8000
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501

  worker_a:
    build:
      context: .
      dockerfile: worker_a/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/

  worker_b:
    build:
      context: .
      dockerfile: worker_b/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/

  worker_c:
    build:
      context: .
      dockerfile: worker_c/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
