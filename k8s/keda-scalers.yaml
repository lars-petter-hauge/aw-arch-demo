# ═════════════════════════════════════════════════════════════════════════════
# KEDA ScaledObject for Worker A
# Scales based on RabbitMQ queue depth: jobs.worker_a
# Min replicas: 1, Max replicas: 5
# Scale trigger: 10 messages in queue
# ═════════════════════════════════════════════════════════════════════════════
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-a-scaler
spec:
  scaleTargetRef:
    name: worker-a
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
  - type: rabbitmq
    metadata:
      host: "amqp://guest:guest@rabbitmq:5672/"
      queueName: jobs.worker_a
      mode: QueueLength
      value: "10"  # Scale up if queue depth exceeds 10
---
