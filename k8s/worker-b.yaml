apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-b
  template:
    metadata:
      labels:
        app: worker-b
    spec:
      containers:
        - name: worker-b
          image: aw-arch-demo-worker-b:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_URL
              value: redis://redis:6379
