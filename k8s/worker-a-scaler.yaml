apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-a-scaler
spec:
  scaleTargetRef:
    name: worker-a
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: queue:worker_a
        listLength: "1"
