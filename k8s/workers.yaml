# Worker A - Fast worker (1s CPU burn)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-a
  template:
    metadata:
      labels:
        app: worker-a
    spec:
      containers:
      - name: worker-a
        image: aw-arch-demo-worker-a:latest
        imagePullPolicy: Never
        env:
        - name: BROKER_URL
          value: amqp://guest:guest@rabbitmq:5672/
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "1000m"
